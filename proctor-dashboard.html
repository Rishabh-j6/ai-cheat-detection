<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctor Dashboard - Multi-Student View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            color: #333;
            font-size: 28px;
        }

        .dashboard-stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .student-card.high-risk {
            border: 3px solid #ff4d4d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 6px rgba(255, 77, 77, 0.3); }
            50% { box-shadow: 0 8px 16px rgba(255, 77, 77, 0.6); }
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .student-info h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 3px;
        }

        .student-info p {
            color: #666;
            font-size: 12px;
        }

        .status-badge {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.active {
            background-color: #d4edda;
            color: #155724;
        }

        .status-badge.warning {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-badge.danger {
            background-color: #f8d7da;
            color: #721c24;
        }

        .integrity-section {
            margin-bottom: 15px;
        }

        .integrity-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .integrity-percentage {
            font-size: 16px;
            font-weight: bold;
        }

        .health-bar-container {
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .health-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease, background 0.3s ease;
        }

        .alerts-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 12px;
            color: #666;
        }

        .alert-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .alert-icon.high {
            background-color: #ff4d4d;
        }

        .alert-icon.medium {
            background-color: #ffad4d;
        }

        .alert-icon.low {
            background-color: #5bc0de;
        }

        .student-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .student-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn-view {
            background-color: #667eea;
            color: white;
        }

        .btn-view:hover {
            background-color: #5568d3;
        }

        .btn-flag {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-flag:hover {
            background-color: #ee5a52;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:hover {
            background-color: #f0f0f0;
        }

        .video-placeholder {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div>
            <h1>🎓 Proctor Dashboard</h1>
            <p style="color: #666; margin-top: 5px;">Advanced Mathematics Quiz - Active Now</p>
        </div>
        <div class="dashboard-stats">
            <div class="stat-item">
                <div class="stat-value" id="activeStudents">0</div>
                <div class="stat-label">Active Students</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" style="color: #ff6b6b;" id="flaggedCount">0</div>
                <div class="stat-label">Flagged</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" style="color: #51cf66;" id="avgIntegrity">0%</div>
                <div class="stat-label">Avg Integrity</div>
            </div>
        </div>
        <div class="controls">
            <button onclick="simulateRandomEvent()">⚡ Simulate Event</button>
            <button onclick="resetAll()">🔄 Reset All</button>
        </div>
    </div>

    <div class="students-grid" id="studentsGrid"></div>

    <script>
        // Sample student data
        const students = [
            { id: 1, name: "Alex Johnson", email: "alex.j@university.edu", avatar: "AJ" },
            { id: 2, name: "Sarah Williams", email: "s.williams@university.edu", avatar: "SW" },
            { id: 3, name: "Michael Chen", email: "m.chen@university.edu", avatar: "MC" },
            { id: 4, name: "Emma Davis", email: "emma.d@university.edu", avatar: "ED" },
            { id: 5, name: "James Wilson", email: "j.wilson@university.edu", avatar: "JW" },
            { id: 6, name: "Olivia Brown", email: "olivia.b@university.edu", avatar: "OB" }
        ];

        // Detection events
        const detectionEvents = [
            { type: 'Tab Switching', severity: 'medium', impact: 8 },
            { type: 'Gaze Off-Screen', severity: 'low', impact: 5 },
            { type: 'Unknown Voice', severity: 'high', impact: 15 },
            { type: 'Sudden Movement', severity: 'low', impact: 3 },
            { type: 'Phone Detected', severity: 'high', impact: 25 },
            { type: 'Multiple Faces', severity: 'high', impact: 20 }
        ];

        // Initialize student states
        const studentStates = students.map(student => ({
            ...student,
            integrity: 100,
            alerts: [],
            status: 'active'
        }));

        // Render students
        function renderStudents() {
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = '';

            studentStates.forEach(student => {
                const card = createStudentCard(student);
                grid.appendChild(card);
            });

            updateStats();
        }

        function createStudentCard(student) {
            const card = document.createElement('div');
            card.className = 'student-card';
            
            if (student.integrity < 50) {
                card.classList.add('high-risk');
            }

            const statusClass = student.integrity > 70 ? 'active' : student.integrity > 40 ? 'warning' : 'danger';
            const statusText = student.integrity > 70 ? 'Safe' : student.integrity > 40 ? 'Monitor' : 'High Risk';

            let healthColor;
            if (student.integrity > 70) {
                healthColor = 'linear-gradient(to right, #51cf66, #8ce99a)';
            } else if (student.integrity > 40) {
                healthColor = 'linear-gradient(to right, #ffd43b, #ffe066)';
            } else {
                healthColor = 'linear-gradient(to right, #ff6b6b, #ff8787)';
            }

            const recentAlerts = student.alerts.slice(-3);

            card.innerHTML = `
                <div class="student-header">
                    <div class="student-avatar">${student.avatar}</div>
                    <div class="student-info">
                        <h3>${student.name}</h3>
                        <p>${student.email}</p>
                    </div>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                </div>

                <div class="video-placeholder">
                    📹 Live Feed
                </div>

                <div class="integrity-section">
                    <div class="integrity-label">
                        <span>Integrity Score</span>
                        <span class="integrity-percentage">${student.integrity}%</span>
                    </div>
                    <div class="health-bar-container">
                        <div class="health-bar" style="width: ${student.integrity}%; background: ${healthColor};"></div>
                    </div>
                </div>

                <div class="alerts-section">
                    <strong style="font-size: 13px; color: #333;">Recent Alerts:</strong>
                    ${recentAlerts.length > 0 ? recentAlerts.map(alert => `
                        <div class="alert-item">
                            <span class="alert-icon ${alert.severity}"></span>
                            <span>${alert.type} (-${alert.impact}%)</span>
                        </div>
                    `).join('') : '<p style="font-size: 12px; color: #999; margin-top: 8px;">No alerts detected</p>'}
                </div>

                <div class="student-actions">
                    <button class="btn-view" onclick="viewDetails(${student.id})">📊 View Details</button>
                    <button class="btn-flag" onclick="flagStudent(${student.id})">🚩 Flag</button>
                </div>
            `;

            return card;
        }

        function updateStats() {
            document.getElementById('activeStudents').textContent = studentStates.length;
            const flaggedCount = studentStates.filter(s => s.integrity < 50).length;
            document.getElementById('flaggedCount').textContent = flaggedCount;
            
            const avgIntegrity = Math.round(
                studentStates.reduce((sum, s) => sum + s.integrity, 0) / studentStates.length
            );
            document.getElementById('avgIntegrity').textContent = avgIntegrity + '%';
        }

        function simulateRandomEvent() {
            const randomStudent = studentStates[Math.floor(Math.random() * studentStates.length)];
            const randomEvent = detectionEvents[Math.floor(Math.random() * detectionEvents.length)];
            
            randomStudent.integrity = Math.max(0, randomStudent.integrity - randomEvent.impact);
            randomStudent.alerts.push(randomEvent);
            
            renderStudents();
        }

        function resetAll() {
            studentStates.forEach(student => {
                student.integrity = 100;
                student.alerts = [];
            });
            renderStudents();
        }

        function viewDetails(studentId) {
            alert(`Viewing detailed analytics for student ID: ${studentId}\n(This would open a detailed view in full implementation)`);
        }

        function flagStudent(studentId) {
            const student = studentStates.find(s => s.id === studentId);
            alert(`Student ${student.name} has been flagged for review.\n(Admin would be notified in full implementation)`);
        }

        // Initial render
        renderStudents();

        // Auto-simulate events every 5 seconds for demo
        setInterval(() => {
            if (Math.random() > 0.5) {
                simulateRandomEvent();
            }
        }, 5000);
    </script>
</body>
</html>
